name: Nexora AI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations on PostgreSQL
        env:
          PYTHONPATH: src
          NEXORA_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/nexora_test
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          PYTHONPATH: src
          TEST_POSTGRES_URL: postgresql+psycopg://test_user:test_password@localhost:5432/nexora_test
          NEXORA_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/nexora_test
          TEST_REDIS_URL: redis://localhost:6379/0
          NEXORA_RATE_LIMIT_REDIS_URL: redis://localhost:6379/0
        run: pytest -q --tb=short

      - name: Build production Docker image
        run: |
          docker build -t nexora-ai:ci .
