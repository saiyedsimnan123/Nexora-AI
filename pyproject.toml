[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "0.1.0"
description = "Nexora AI — Autonomous Research Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "qdrant-client>=1.9.0,<2.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=1.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "redis>=5.0.0,<6.0.0",
    "vercel-queue>=0.10.1,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.nexora.server:app"

[[tool.vercel.subscribers]]
topic = "graph-extraction-jobs"
entrypoint = "nexora.graph.queue_consumer"

[[tool.vercel.subscribers]]
topic = "research-query-jobs"
entrypoint = "nexora.research.queue_consumer"
