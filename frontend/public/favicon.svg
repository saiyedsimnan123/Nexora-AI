<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="coreGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#070913"/>
  <circle cx="16" cy="16" r="11" stroke="url(#coreGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#00f5d4" stroke-width="1" opacity="0.7" transform="rotate(-30 16 16)"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#8b5cf6" stroke-width="1" opacity="0.7" transform="rotate(30 16 16)"/>
  <circle cx="16" cy="16" r="4.5" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>
